<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FRAME_OS | Iframe Customizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              nothingBlack: "#000000",
              nothingCard: "#111111",
              nothingCardHover: "#161616",
              nothingBorder: "#222222",
              nothingBorderHover: "#333333",
              nothingRed: "#d71921",
              nothingRedHover: "#ef232a",
              nothingGray: "#888888",
              nothingLightGray: "#cccccc",
            },
          },
        },
      };
    </script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Space+Grotesk:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Space Grotesk", sans-serif;
        background-color: #000000;
        color: #ffffff;
      }
      .mono-font {
        font-family: "JetBrains Mono", monospace;
      }
      #preview-content {
        width: 100%;
        min-height: 120px;
        background: #ffffff;
      }
      #preview-content iframe,
      #fiind-booking-embed,
      #fiind-booking-embed iframe {
        width: 100% !important;
        max-width: 100%;
        border: 0;
        display: block;
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #000000;
      }
      ::-webkit-scrollbar-thumb {
        background: #333333;
        border-radius: 0px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #555555;
      }
    </style>
  </head>
  <body
    class="bg-nothingBlack text-white min-h-screen flex flex-col antialiased selection:bg-nothingRed selection:text-white"
  >
    <div
      id="toast"
      class="fixed bottom-4 right-4 sm:bottom-6 sm:right-6 z-50 max-w-[calc(100vw-2rem)] transform translate-y-24 opacity-0 transition-all duration-200 bg-nothingCard border border-nothingBorder text-white px-4 py-3 sm:px-5 rounded-[4px] shadow-none flex items-center gap-3"
    >
      <span class="w-2 h-2 bg-nothingRed rounded-full shrink-0"></span>
      <span
        id="toast-message"
        class="mono-font text-[10px] sm:text-xs tracking-wider uppercase font-bold text-nothingLightGray"
        >ACTION SUCCESSFUL</span
      >
    </div>

    <header
      class="sticky top-0 z-40 border-b border-nothingBorder bg-nothingBlack/95 backdrop-blur-sm"
    >
      <div
        class="w-full max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 h-14 sm:h-16 flex items-center justify-between gap-3"
      >
        <div class="min-w-0 flex items-center gap-2 sm:gap-3">
          <span
            class="w-8 h-8 sm:w-9 sm:h-9 bg-nothingRed flex items-center justify-center rounded-[4px] text-black font-black text-sm sm:text-base mono-font shrink-0"
            >N</span
          >
          <div class="min-w-0">
            <h1
              class="mono-font font-bold text-xs sm:text-sm tracking-wider uppercase text-white truncate"
            >
              IFRAME_CUSTOMIZER
            </h1>
            <p
              class="mono-font text-[9px] sm:text-[10px] text-nothingGray uppercase tracking-wider hidden xs:block sm:block"
            >
              SANDBOX_CONTROLLER
            </p>
          </div>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <button
            onclick="refreshIframe()"
            title="Refresh"
            aria-label="Refresh"
            class="mono-font text-[10px] sm:text-xs bg-nothingCard hover:bg-nothingCardHover text-white border border-nothingBorder hover:border-nothingBorderHover w-10 h-10 sm:w-auto sm:h-auto sm:px-4 sm:py-2.5 rounded-[6px] font-bold uppercase tracking-wider transition flex items-center justify-center gap-2"
          >
            <i class="fa-solid fa-rotate-right text-nothingRed"></i>
            <span class="hidden sm:inline">REFRESH</span>
          </button>
          <button
            onclick="renderCode()"
            title="Render"
            aria-label="Render"
            class="mono-font text-[10px] sm:text-xs bg-nothingRed hover:bg-nothingRedHover text-black w-10 h-10 sm:w-auto sm:h-auto sm:px-5 sm:py-2.5 rounded-[6px] font-black uppercase tracking-wider transition flex items-center justify-center gap-2"
          >
            <i class="fa-solid fa-play text-xs text-black"></i>
            <span class="hidden sm:inline">RENDER</span>
          </button>
        </div>
      </div>
    </header>

    <main
      class="flex-grow w-full max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-4 sm:py-6 flex flex-col gap-4 sm:gap-6"
    >
      <section
        class="bg-nothingCard border border-nothingBorder rounded-[12px] sm:rounded-[16px] p-4 sm:p-6 md:p-8 flex flex-col gap-4 sm:gap-6"
      >
        <div class="flex flex-col gap-2">
          <div class="flex items-center justify-between gap-2">
            <label
              for="code-textarea"
              class="mono-font text-[10px] sm:text-xs text-nothingLightGray uppercase tracking-wider flex items-center gap-2 min-w-0"
            >
              <span
                class="w-1.5 h-1.5 bg-nothingRed rounded-full shrink-0"
              ></span>
              <span class="truncate">SOURCE_CODE_INPUT</span>
            </label>
            <span
              class="mono-font text-[9px] sm:text-[10px] text-nothingGray shrink-0"
              >LIVE_INJECTION</span
            >
          </div>
          <textarea
            id="code-textarea"
            rows="8"
            class="mono-font w-full min-h-[160px] sm:min-h-[220px] bg-nothingBlack border border-nothingBorder rounded-[10px] sm:rounded-[12px] p-3 sm:p-4 text-[11px] sm:text-sm text-nothingLightGray focus:outline-none focus:border-nothingRed transition resize-y"
            placeholder="Enter HTML, CSS or JS here..."
          ></textarea>
        </div>

        <div
          class="flex items-center justify-between gap-2 pt-2 border-t border-nothingBorder"
        >
          <div class="flex items-center gap-2 sm:gap-3 min-w-0">
            <span
              class="w-2 h-2 sm:w-2.5 sm:h-2.5 bg-nothingRed rounded-full animate-pulse shrink-0"
            ></span>
            <h3
              id="rendered-title-display"
              class="mono-font font-bold text-[11px] sm:text-sm tracking-wider uppercase text-white truncate"
            >
              NOTHING_WIDGET_SANDBOX
            </h3>
          </div>
          <span
            class="mono-font text-[9px] sm:text-[10px] text-nothingGray shrink-0"
            >HEIGHT: AUTO</span
          >
        </div>

        <div
          id="iframe-container-box"
          class="w-full border border-nothingRed rounded-[10px] sm:rounded-[12px] overflow-hidden bg-white"
        >
          <div id="preview-content"></div>
        </div>
      </section>
    </main>

    <script>
      const defaultTemplate = `<div id="fiind-booking-embed"></div>
<script
  src="https://bahlou-marketplace-dev.netlify.app/assets/js/fiind-embed.js"
  data-booking-url="https://bahlou-marketplace-dev.netlify.app/klinik/Mukundluxecare?lang=da&hide=true"
  data-height="800px"
  data-language="da"
  data-theme="light"
  data-show-language-switcher="false"
  data-show-theme-switcher="false"
><\/script>`;

      let resizeObserver = null;

      window.addEventListener("DOMContentLoaded", () => {
        document.getElementById("code-textarea").value = defaultTemplate;
        renderCode();
      });

      window.addEventListener("resize", () => {
        resizePreview();
      });

      function showToast(message) {
        const toast = document.getElementById("toast");
        document.getElementById("toast-message").textContent = message;
        toast.classList.remove("translate-y-24", "opacity-0");
        toast.classList.add("translate-y-0", "opacity-100");
        setTimeout(() => {
          toast.classList.add("translate-y-24", "opacity-0");
          toast.classList.remove("translate-y-0", "opacity-100");
        }, 2200);
      }

      function resizePreview() {
        const preview = document.getElementById("preview-content");
        if (!preview) return;

        const nested = preview.querySelector("iframe");
        if (nested) {
          try {
            const doc = nested.contentDocument || nested.contentWindow.document;
            if (doc && doc.body) {
              const height = Math.max(
                doc.body.scrollHeight,
                doc.documentElement.scrollHeight,
                120,
              );
              nested.style.height = height + "px";
              return;
            }
          } catch (e) {
            // Cross-origin: keep data-height / existing height
          }
          if (!nested.style.height) {
            nested.style.height = "800px";
          }
        }
      }

      function observePreview() {
        if (resizeObserver) {
          resizeObserver.disconnect();
          resizeObserver = null;
        }

        const preview = document.getElementById("preview-content");
        if (!preview) return;

        resizeObserver = new ResizeObserver(() => resizePreview());
        resizeObserver.observe(preview);
        const nested = preview.querySelector("iframe");
        if (nested) resizeObserver.observe(nested);
      }

      function extractBookingUrl(rawHtml) {
        const htmlText = (rawHtml || "").trim();
        if (!htmlText) return "";

        const dataUrlMatch = htmlText.match(
          /data-booking-url\s*=\s*["']([^"']+)["']/i,
        );
        if (dataUrlMatch && dataUrlMatch[1]) return dataUrlMatch[1].trim();

        const srcMatch = htmlText.match(
          /<iframe[^>]*\ssrc\s*=\s*["']([^"']+)["'][^>]*>/i,
        );
        if (srcMatch && srcMatch[1]) return srcMatch[1].trim();

        if (/^https?:\/\//i.test(htmlText)) return htmlText;
        return "";
      }

      // Same path as index embed browser + live bahlou-marketplace fiind-embed.js:
      // inject the script tag so it builds the iframe (adds lang/theme/singlePage).
      function injectEmbedScript(rawHtml, bookingUrl) {
        const preview = document.getElementById("preview-content");
        preview.innerHTML = "";

        const scriptMatch = rawHtml.match(/<script([^>]*)>/i);
        const attrBlock = scriptMatch ? scriptMatch[1] : "";
        const srcMatch = attrBlock.match(/\ssrc\s*=\s*["']([^"']+)["']/i);
        let scriptSrc = srcMatch ? srcMatch[1] : "";

        if (!scriptSrc && bookingUrl) {
          try {
            scriptSrc =
              new URL(bookingUrl).origin + "/assets/js/fiind-embed.js";
          } catch (e) {
            scriptSrc =
              "https://bahlou-marketplace-dev.netlify.app/assets/js/fiind-embed.js";
          }
        }

        if (!scriptSrc) {
          showToast("NO EMBED SCRIPT");
          return;
        }

        const scriptElement = document.createElement("script");
        scriptElement.src = scriptSrc;

        const dataAttrRegex = /data-([a-z0-9-]+)\s*=\s*["']([^"']*)["']/gi;
        let attrMatch;
        while ((attrMatch = dataAttrRegex.exec(attrBlock)) !== null) {
          scriptElement.setAttribute("data-" + attrMatch[1], attrMatch[2]);
        }

        if (!scriptElement.getAttribute("data-booking-url") && bookingUrl) {
          scriptElement.setAttribute("data-booking-url", bookingUrl);
        }
        if (!scriptElement.getAttribute("data-height")) {
          scriptElement.setAttribute("data-height", "800px");
        }
        if (!scriptElement.getAttribute("data-language")) {
          scriptElement.setAttribute("data-language", "da");
        }
        if (!scriptElement.getAttribute("data-theme")) {
          scriptElement.setAttribute("data-theme", "light");
        }
        if (!scriptElement.getAttribute("data-show-language-switcher")) {
          scriptElement.setAttribute("data-show-language-switcher", "false");
        }
        if (!scriptElement.getAttribute("data-show-theme-switcher")) {
          scriptElement.setAttribute("data-show-theme-switcher", "false");
        }

        preview.appendChild(scriptElement);
      }

      function renderCode() {
        const code = document.getElementById("code-textarea").value.trim();
        const preview = document.getElementById("preview-content");

        try {
          preview.innerHTML = "";

          if (!code) {
            preview.innerHTML =
              '<div class="mono-font text-xs text-[#888] p-6 text-center uppercase tracking-wider">No code to render</div>';
            showToast("EMPTY INPUT");
            return;
          }

          const bookingUrl = extractBookingUrl(code);
          const heightMatch = code.match(/data-height\s*=\s*["']([^"']+)["']/i);
          const embedHeight = heightMatch ? heightMatch[1] : "800px";

          if (/<iframe[\s>]/i.test(code)) {
            preview.innerHTML = code;
            const nested = preview.querySelector("iframe");
            if (nested) {
              nested.style.width = "100%";
              nested.style.height = embedHeight;
              nested.style.border = "0";
            }
          } else if (/<script[\s>]/i.test(code) || bookingUrl) {
            injectEmbedScript(code, bookingUrl);
          } else {
            preview.innerHTML = code;
          }

          setTimeout(() => {
            const nested = preview.querySelector("iframe");
            if (nested && !nested.style.height) {
              nested.style.height = embedHeight;
            }
            resizePreview();
            observePreview();
          }, 300);

          setTimeout(resizePreview, 1000);
          setTimeout(resizePreview, 2500);

          showToast("CODE RENDERED");
        } catch (err) {
          console.error(err);
          showToast("RENDER FAILED");
        }
      }

      function refreshIframe() {
        renderCode();
      }
    </script>
  </body>
</html>
